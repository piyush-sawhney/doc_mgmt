[alembic]
# Alembic is the only supported way to change the schema (docs/04 §12).
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# The URL is supplied by the caller: DOCVAULT_DSN, -x dsn=..., or a connection
# handed to env.py by the test fixture. Keeping it out of this file means no
# developer's DSN is committed.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
